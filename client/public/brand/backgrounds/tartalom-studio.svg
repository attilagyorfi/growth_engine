<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine content háttér">

  <defs>
    <pattern id="grid-content" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-content" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 70) rotate(90) scale(430)">
      <stop stop-color="#8B5CF6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-content" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 330) rotate(90) scale(380)">
      <stop stop-color="#7C3AED" stop-opacity="0.13"></stop><stop offset="1" stop-color="#7C3AED" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-content" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-content" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-content)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-content)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-content)"></rect>

  <g opacity="0.3">
    <rect x="1040" y="176" width="230" height="150" rx="12" stroke="#8B5CF6" stroke-width="1.3" opacity="0.35"></rect>
    <rect x="1010" y="152" width="230" height="150" rx="12" stroke="#8B5CF6" stroke-width="1.3" opacity="0.6"></rect>
    <rect x="980" y="128" width="230" height="150" rx="12" stroke="#8B5CF6" stroke-width="1.5" fill="#0A0B0F" fill-opacity="0.5"></rect>
    <g stroke="#8B5CF6" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
      <path d="M1008 164h130M1008 188h172M1008 212h96M1008 236h150"></path>
    </g>
  </g>
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.05">
    <path d="M120 200h300M120 232h420M120 264h240M120 296h360"></path>
  </g>
  <rect width="1440" height="420" fill="url(#fade-content)"></rect>
  <rect width="1440" height="420" filter="url(#grain-content)" opacity="0.05"></rect>
</svg>