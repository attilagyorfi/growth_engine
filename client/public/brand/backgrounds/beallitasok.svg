<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine settings háttér">

  <defs>
    <pattern id="grid-settings" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-settings" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 100) rotate(90) scale(400)">
      <stop stop-color="#14B8A6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-settings" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 340) rotate(90) scale(380)">
      <stop stop-color="#0D9488" stop-opacity="0.13"></stop><stop offset="1" stop-color="#0D9488" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-settings" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-settings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-settings)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-settings)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-settings)"></rect>

  <g transform="translate(1150 200)" stroke="#14B8A6" fill="none">
    <circle r="118" stroke-width="1" opacity="0.14" stroke-dasharray="3 9"></circle>
    <circle r="84" stroke-width="1.4" opacity="0.3"></circle>
    <circle r="30" stroke-width="1.8" opacity="0.5"></circle>
    <g opacity="0.4" stroke-width="2" stroke-linecap="round">
      <path d="M0 -84 V -110M0 84 V 110M-84 0 H -110M84 0 H 110                M-59 -59 L-78 -78M59 59 L78 78M59 -59 L78 -78M-59 59 L-78 78"></path>
    </g>
  </g>
  <g stroke="#14B8A6" stroke-width="1.5" opacity="0.28" stroke-linecap="round">
    <path d="M150 200h180"></path><path d="M150 250h240"></path><path d="M150 300h140"></path>
  </g>
  <g fill="#14B8A6" opacity="0.5"><circle cx="330" cy="200" r="6"></circle><circle cx="290" cy="250" r="6"></circle><circle cx="230" cy="300" r="6"></circle></g>
  <rect width="1440" height="420" fill="url(#fade-settings)"></rect>
  <rect width="1440" height="420" filter="url(#grain-settings)" opacity="0.05"></rect>
</svg>