<svg xmlns="http://www.w3.org/2000/svg" width="390" height="220" viewBox="0 0 390 220" fill="none" role="img" aria-label="Growth Engine mob-ma háttér">

  <defs>
    <pattern id="grid-mob-ma" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-mob-ma" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 20) rotate(90) scale(220)">
      <stop stop-color="#8B5CF6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-mob-ma" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(40 200) rotate(90) scale(190)">
      <stop stop-color="#7C3AED" stop-opacity="0.13"></stop><stop offset="1" stop-color="#7C3AED" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-mob-ma" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-mob-ma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="390" height="220" fill="#0A0B0F"></rect>
  <rect width="390" height="220" fill="url(#grid-mob-ma)"></rect>
  <rect width="390" height="220" fill="url(#glowA-mob-ma)"></rect>
  <rect width="390" height="220" fill="url(#glowB-mob-ma)"></rect>

  <path d="M0 168 L48 156 L96 160 L144 138 L192 128 L240 132 L288 108 L336 96 L390 78" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"></path>
  <g fill="#8B5CF6" opacity="0.5"><circle cx="336" cy="96" r="3"></circle></g>
  <rect width="390" height="220" fill="url(#fade-mob-ma)"></rect>
  <rect width="390" height="220" filter="url(#grain-mob-ma)" opacity="0.05"></rect>
</svg>