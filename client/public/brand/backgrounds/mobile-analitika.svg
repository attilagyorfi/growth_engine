<svg xmlns="http://www.w3.org/2000/svg" width="390" height="220" viewBox="0 0 390 220" fill="none" role="img" aria-label="Growth Engine mob-an háttér">

  <defs>
    <pattern id="grid-mob-an" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-mob-an" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(340 26) rotate(90) scale(240)">
      <stop stop-color="#14B8A6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-mob-an" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(50 200) rotate(90) scale(190)">
      <stop stop-color="#0D9488" stop-opacity="0.13"></stop><stop offset="1" stop-color="#0D9488" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-mob-an" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-mob-an" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="390" height="220" fill="#0A0B0F"></rect>
  <rect width="390" height="220" fill="url(#grid-mob-an)"></rect>
  <rect width="390" height="220" fill="url(#glowA-mob-an)"></rect>
  <rect width="390" height="220" fill="url(#glowB-mob-an)"></rect>

  <defs><linearGradient id="mobArea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14B8A6" stop-opacity="0.22"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop></linearGradient></defs>
  <path d="M0 176 L0 150 L65 142 L130 120 L195 126 L260 96 L325 82 L390 60 L390 176 Z" fill="url(#mobArea)"></path>
  <path d="M0 150 L65 142 L130 120 L195 126 L260 96 L325 82 L390 60" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"></path>
  <rect width="390" height="220" fill="url(#fade-mob-an)"></rect>
  <rect width="390" height="220" filter="url(#grain-mob-an)" opacity="0.05"></rect>
</svg>