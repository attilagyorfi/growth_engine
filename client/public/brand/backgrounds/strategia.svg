<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine strat háttér">

  <defs>
    <pattern id="grid-strat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-strat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 90) rotate(90) scale(440)">
      <stop stop-color="#14B8A6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-strat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 360) rotate(90) scale(380)">
      <stop stop-color="#0D9488" stop-opacity="0.13"></stop><stop offset="1" stop-color="#0D9488" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-strat" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-strat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-strat)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-strat)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-strat)"></rect>

  <g transform="translate(1130 190)" stroke="#14B8A6" fill="none">
    <circle r="150" stroke-width="1" opacity="0.14"></circle><circle r="112" stroke-width="1" opacity="0.2"></circle>
    <circle r="74" stroke-width="1.2" opacity="0.3"></circle><circle r="36" stroke-width="1.5" opacity="0.45"></circle>
    <circle r="6" fill="#14B8A6" stroke="none" opacity="0.8"></circle>
    <path d="M-150 0H150M0 -150V150" stroke-width="1" opacity="0.1"></path>
  </g>
  <g stroke="#14B8A6" stroke-width="1.6" opacity="0.4" stroke-linecap="round">
    <path d="M170 300 L330 300"></path><path d="M170 246 L280 246" opacity="0.7"></path><path d="M170 192 L400 192" opacity="0.5"></path>
  </g>
  <g fill="#14B8A6" opacity="0.55"><circle cx="160" cy="300" r="4"></circle><circle cx="160" cy="246" r="4"></circle><circle cx="160" cy="192" r="4"></circle></g>
  <rect width="1440" height="420" fill="url(#fade-strat)"></rect>
  <rect width="1440" height="420" filter="url(#grain-strat)" opacity="0.05"></rect>
</svg>