<svg xmlns="http://www.w3.org/2000/svg" width="390" height="220" viewBox="0 0 390 220" fill="none" role="img" aria-label="Growth Engine mob-cal háttér">

  <defs>
    <pattern id="grid-mob-cal" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-mob-cal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 30) rotate(90) scale(230)">
      <stop stop-color="#8B5CF6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-mob-cal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(340 190) rotate(90) scale(190)">
      <stop stop-color="#7C3AED" stop-opacity="0.13"></stop><stop offset="1" stop-color="#7C3AED" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-mob-cal" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-mob-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="390" height="220" fill="#0A0B0F"></rect>
  <rect width="390" height="220" fill="url(#grid-mob-cal)"></rect>
  <rect width="390" height="220" fill="url(#glowA-mob-cal)"></rect>
  <rect width="390" height="220" fill="url(#glowB-mob-cal)"></rect>

  <g stroke="#8B5CF6" stroke-width="1.2" opacity="0.3">
    <rect x="252" y="72" width="104" height="104" rx="10"></rect>
    <path d="M252 100h104M278 72v-10M330 72v-10"></path>
  </g>
  <g fill="#8B5CF6" opacity="0.45"><circle cx="278" cy="126" r="4"></circle><circle cx="304" cy="126" r="4" opacity="0.6"></circle><circle cx="330" cy="152" r="4" opacity="0.4"></circle></g>
  <rect width="390" height="220" fill="url(#fade-mob-cal)"></rect>
  <rect width="390" height="220" filter="url(#grain-mob-cal)" opacity="0.05"></rect>
</svg>