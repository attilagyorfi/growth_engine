<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine reports háttér">

  <defs>
    <pattern id="grid-reports" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-reports" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 70) rotate(90) scale(420)">
      <stop stop-color="#8B5CF6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-reports" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 350) rotate(90) scale(380)">
      <stop stop-color="#7C3AED" stop-opacity="0.13"></stop><stop offset="1" stop-color="#7C3AED" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-reports" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-reports" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-reports)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-reports)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-reports)"></rect>

  <g opacity="0.34">
    <rect x="1090" y="130" width="180" height="230" rx="10" stroke="#8B5CF6" stroke-width="1.2" opacity="0.3"></rect>
    <rect x="1060" y="112" width="180" height="230" rx="10" stroke="#8B5CF6" stroke-width="1.3" opacity="0.55"></rect>
    <rect x="1030" y="94" width="180" height="230" rx="10" stroke="#8B5CF6" stroke-width="1.5" fill="#0A0B0F" fill-opacity="0.55"></rect>
    <g stroke="#8B5CF6" stroke-width="1.3" stroke-linecap="round" opacity="0.5">
      <path d="M1054 128h96M1054 150h132M1054 172h72"></path>
    </g>
    <g fill="#8B5CF6" opacity="0.4">
      <rect x="1054" y="214" width="18" height="44" rx="3"></rect><rect x="1080" y="196" width="18" height="62" rx="3"></rect>
      <rect x="1106" y="228" width="18" height="30" rx="3"></rect><rect x="1132" y="182" width="18" height="76" rx="3"></rect>
    </g>
  </g>
  <rect width="1440" height="420" fill="url(#fade-reports)"></rect>
  <rect width="1440" height="420" filter="url(#grain-reports)" opacity="0.05"></rect>
</svg>