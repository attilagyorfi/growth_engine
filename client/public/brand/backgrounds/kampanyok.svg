<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine camp háttér">

  <defs>
    <pattern id="grid-camp" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-camp" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 80) rotate(90) scale(460)">
      <stop stop-color="#14B8A6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-camp" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1260 340) rotate(90) scale(380)">
      <stop stop-color="#0D9488" stop-opacity="0.13"></stop><stop offset="1" stop-color="#0D9488" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-camp" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-camp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-camp)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-camp)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-camp)"></rect>

  <g transform="translate(230 210)" stroke="#14B8A6" fill="none" stroke-linecap="round">
    <path d="M0 -14 A 14 14 0 0 1 0 14" stroke-width="2.4" opacity="0.8"></path>
    <path d="M28 -46 A 46 46 0 0 1 28 46" stroke-width="1.8" opacity="0.5"></path>
    <path d="M56 -80 A 80 80 0 0 1 56 80" stroke-width="1.5" opacity="0.32"></path>
    <path d="M84 -116 A 116 116 0 0 1 84 116" stroke-width="1.2" opacity="0.2"></path>
    <path d="M112 -152 A 152 152 0 0 1 112 152" stroke-width="1" opacity="0.12"></path>
    <circle r="5" fill="#14B8A6" stroke="none" opacity="0.85"></circle>
  </g>
  <g fill="#14B8A6" opacity="0.28">
    <rect x="880" y="286" width="60" height="8" rx="4"></rect><rect x="960" y="286" width="120" height="8" rx="4" opacity="0.6"></rect>
    <rect x="1100" y="286" width="40" height="8" rx="4" opacity="0.4"></rect>
  </g>
  <rect width="1440" height="420" fill="url(#fade-camp)"></rect>
  <rect width="1440" height="420" filter="url(#grain-camp)" opacity="0.05"></rect>
</svg>