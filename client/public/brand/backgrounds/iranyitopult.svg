<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-label="Growth Engine dash háttér">

  <defs>
    <pattern id="grid-dash" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glowA-dash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 40) rotate(90) scale(480)">
      <stop stop-color="#14B8A6" stop-opacity="0.20"></stop><stop offset="1" stop-color="#14B8A6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB-dash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 400) rotate(90) scale(380)">
      <stop stop-color="#0D9488" stop-opacity="0.13"></stop><stop offset="1" stop-color="#0D9488" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="grain-dash" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <linearGradient id="fade-dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0B0F" stop-opacity="0"></stop><stop offset="1" stop-color="#0A0B0F" stop-opacity="0.9"></stop>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="#0A0B0F"></rect>
  <rect width="1440" height="420" fill="url(#grid-dash)"></rect>
  <rect width="1440" height="420" fill="url(#glowA-dash)"></rect>
  <rect width="1440" height="420" fill="url(#glowB-dash)"></rect>

  <g opacity="0.5">
    <path d="M0 330 L120 305 L240 315 L360 268 L480 250 L600 262 L720 210 L840 188 L960 196 L1080 148 L1200 122 L1320 132 L1440 88" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></path>
    <g fill="#14B8A6" opacity="0.5">
      <circle cx="480" cy="250" r="3.5"></circle><circle cx="960" cy="196" r="3.5"></circle><circle cx="1320" cy="132" r="3.5"></circle>
    </g>
  </g>
  <g fill="#ffffff" opacity="0.045">
    <rect x="90" y="352" width="26" height="46" rx="4"></rect><rect x="150" y="336" width="26" height="62" rx="4"></rect>
    <rect x="210" y="344" width="26" height="54" rx="4"></rect><rect x="270" y="318" width="26" height="80" rx="4"></rect>
    <rect x="330" y="330" width="26" height="68" rx="4"></rect><rect x="390" y="300" width="26" height="98" rx="4"></rect>
  </g>
  <rect width="1440" height="420" fill="url(#fade-dash)"></rect>
  <rect width="1440" height="420" filter="url(#grain-dash)" opacity="0.05"></rect>
</svg>