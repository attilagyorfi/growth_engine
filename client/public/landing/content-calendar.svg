    <text x="546" y="410" fill="#E4E4E7" font-weight="600">kérdések</text>
    <text x="546" y="434" fill="#C4B5FD" font-size="11">Vázlat</text>

    <!-- Péntek -->
    <rect x="692" y="228" width="136" height="104" rx="10" fill="#1C1C26" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="692" y="228" width="4" height="104" rx="2" fill="#A78BFA"/>
    <text x="706" y="252" fill="#71717A" font-size="11" font-weight="600">BLOG · 10:00</text>
    <text x="706" y="276" fill="#E4E4E7" font-weight="600">5 tipp a téli</text>
    <text x="706" y="294" fill="#E4E4E7" font-weight="600">szezonra</text>
    <text x="706" y="318" fill="#C4B5FD" font-size="11">Vázlat</text>

    <!-- Szombat: üres -->
    <rect x="852" y="228" width="136" height="104" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="5 5"/>
    <text x="920" y="285" fill="#52525B" font-size="13" text-anchor="middle">+ Új tartalom</text>

    <!-- Vasárnap -->
    <rect x="1012" y="228" width="136" height="104" rx="10" fill="#1C1C26" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="1012" y="228" width="4" height="104" rx="2" fill="#A78BFA"/>
    <text x="1026" y="252" fill="#71717A" font-size="11" font-weight="600">LINKEDIN · 18:00</text>
    <text x="1026" y="276" fill="#E4E4E7" font-weight="600">Heti</text>
    <text x="1026" y="294" fill="#E4E4E7" font-weight="600">összefoglaló</text>
    <text x="1026" y="318" fill="#C4B5FD" font-size="11">Vázlat</text>
