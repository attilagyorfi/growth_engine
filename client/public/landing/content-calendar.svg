  <!-- Pillérek összesítő -->
  <rect x="60" y="600" width="1080" height="140" rx="12" fill="#18181F"/>
  <text x="84" y="636" fill="#F4F4F5" font-size="16" font-weight="600">A hét tartalmi pillérei</text>
  <g font-size="13" fill="#A1A1AA">
    <text x="84" y="672">Szakértelem</text>
    <rect x="220" y="662" width="400" height="12" rx="6" fill="#27272A"/>
    <rect x="220" y="662" width="240" height="12" rx="6" fill="#A78BFA"/>
    <text x="636" y="672">3 tartalom</text>

    <text x="84" y="704">Ügyfélközelség</text>
    <rect x="220" y="694" width="400" height="12" rx="6" fill="#27272A"/>
    <rect x="220" y="694" width="160" height="12" rx="6" fill="#38BDF8"/>
    <text x="636" y="704">2 tartalom</text>

    <text x="760" y="672">Kész ezen a héten</text>
    <text x="760" y="712" fill="#F4F4F5" font-size="32" font-weight="700">2<tspan fill="#71717A" font-size="18"> / 7</tspan></text>
    <text x="940" y="672">Jóváhagyásra vár</text>
    <text x="940" y="712" fill="#FBBF24" font-size="32" font-weight="700">2</text>
  </g>
</svg>
