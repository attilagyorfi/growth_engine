    <rect x="532" y="228" width="136" height="104" rx="10" fill="#1C1C26" stroke="#FBBF24" stroke-opacity="0.35"/>
    <rect x="532" y="228" width="4" height="104" rx="2" fill="#FBBF24"/>
    <text x="546" y="252" fill="#71717A" font-size="11" font-weight="600">LINKEDIN · 9:00</text>
    <text x="546" y="276" fill="#E4E4E7" font-weight="600">Őszi akció</text>
    <text x="546" y="294" fill="#E4E4E7" font-weight="600">bejelentése</text>
    <text x="546" y="318" fill="#FBBF24" font-size="11">Jóváhagyásra vár</text>

    <rect x="532" y="344" width="136" height="104" rx="10" fill="#1C1C26" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="532" y="344" width="4" height="104" rx="2" fill="#A78BFA"/>
