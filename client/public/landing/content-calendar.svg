    <text x="226" y="252" fill="#71717A" font-size="11" font-weight="600">BLOG · 10:00</text>
    <text x="226" y="276" fill="#E4E4E7" font-weight="600">Így válassz</text>
    <text x="226" y="294" fill="#E4E4E7" font-weight="600">partnert</text>
    <text x="226" y="318" fill="#34D399" font-size="11">Jóváhagyva</text>

