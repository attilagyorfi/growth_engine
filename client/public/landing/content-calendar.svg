<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Heti tartalomnaptár minta nézet – Minta Cég Kft.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0E0E16"/>

  <!-- Fejléc -->
  <text x="40" y="62" fill="#F4F4F5" font-size="26" font-weight="700">Tartalomnaptár</text>
  <text x="40" y="90" fill="#A1A1AA" font-size="14">Minta Cég Kft. · 2026. november, 2. hét</text>
  <rect x="860" y="40" width="40" height="40" rx="10" fill="#18181F" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M884 50 L874 60 L884 70" fill="none" stroke="#A1A1AA" stroke-width="2"/>
  <rect x="910" y="40" width="40" height="40" rx="10" fill="#18181F" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M926 50 L936 60 L926 70" fill="none" stroke="#A1A1AA" stroke-width="2"/>
  <rect x="964" y="40" width="196" height="40" rx="10" fill="url(#accent)"/>
  <text x="1062" y="66" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Havi terv generálása</text>

  <!-- Jelmagyarázat -->
  <g font-size="13" fill="#A1A1AA">
    <circle cx="46" cy="128" r="5" fill="#A78BFA"/><text x="58" y="133">Vázlat</text>
    <circle cx="130" cy="128" r="5" fill="#FBBF24"/><text x="142" y="133">Jóváhagyásra vár</text>
    <circle cx="274" cy="128" r="5" fill="#34D399"/><text x="286" y="133">Jóváhagyva</text>
  </g>

  <!-- Rács -->
  <rect x="40" y="156" width="1120" height="604" rx="16" fill="#13131B" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g stroke="#FFFFFF" stroke-opacity="0.06">
    <line x1="200" y1="156" x2="200" y2="760"/>
    <line x1="360" y1="156" x2="360" y2="760"/>
    <line x1="520" y1="156" x2="520" y2="760"/>
    <line x1="680" y1="156" x2="680" y2="760"/>
    <line x1="840" y1="156" x2="840" y2="760"/>
    <line x1="1000" y1="156" x2="1000" y2="760"/>
    <line x1="40" y1="212" x2="1160" y2="212"/>
  </g>
  <g font-size="13" fill="#A1A1AA" font-weight="600">
    <text x="60" y="190">H <tspan fill="#71717A" font-weight="400">nov. 9.</tspan></text>
    <text x="220" y="190">K <tspan fill="#71717A" font-weight="400">nov. 10.</tspan></text>
    <text x="380" y="190">Sze <tspan fill="#71717A" font-weight="400">nov. 11.</tspan></text>
    <text x="540" y="190" fill="#C4B5FD">Cs <tspan font-weight="400">nov. 12.</tspan></text>
    <text x="700" y="190">P <tspan fill="#71717A" font-weight="400">nov. 13.</tspan></text>
    <text x="860" y="190">Szo <tspan fill="#71717A" font-weight="400">nov. 14.</tspan></text>
    <text x="1020" y="190">V <tspan fill="#71717A" font-weight="400">nov. 15.</tspan></text>
  </g>
  <rect x="521" y="213" width="158" height="546" fill="#8B5CF6" fill-opacity="0.05"/>

